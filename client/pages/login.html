<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Green Hub | Login</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/premium.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div data-gh-header-root></div>

    <!-- Login Section -->

    <section class="login-container">

        <div class="login-box">

            <h1>Welcome Back!</h1>

            <p>Login to your Green Hub account</p>

            <form>

                <label for="login-email">Email Address</label>

                <input type="email"
                    id="login-email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

                <label for="login-password">Password</label>

                <input type="password"
                    id="login-password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

                <div class="options">

                    <label>

                        <input type="checkbox"
                            id="login-remember"
                            name="remember">

                        Remember Me

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <p id="login-error" class="auth-error" hidden></p>

                <button type="submit">

                    Login

                </button>

            </form>

            <hr>

            <p>

                Don't have an account?

                <a href="register.html">

                    Register Here

                </a>

            </p>

        </div>

    </section>

    <!-- Benefits -->

    <section class="login-benefits">

        <h2>Why Login?</h2>

        <div class="benefit-container">

            <div class="benefit">

                <i class="fa-solid fa-cart-shopping"></i>

                <h3>Track Orders</h3>

                <p>View your order history anytime.</p>

            </div>

            <div class="benefit">

                <i class="fa-solid fa-heart"></i>

                <h3>Wishlist</h3>

                <p>Save your favourite plants.</p>

            </div>

            <div class="benefit">

                <i class="fa-solid fa-credit-card"></i>

                <h3>Fast Checkout</h3>

                <p>Secure payment and quick ordering.</p>

            </div>

        </div>

    </section>

    <!-- Footer -->

    <div data-gh-footer-root></div>


<script src="../js/cart.js?v=3"></script>
    <script src="../js/header.js?v=4"></script>
    <script src="../js/premium.js?v=4"></script>
<script src="../js/script.js?v=4"></script>
</body>

</html>
