<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Hub | Shopping Cart</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/premium.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div data-gh-header-root></div>

    <!-- Cart Section -->

    <section class="cart">

        <h1>Your Shopping Cart</h1>

        <table border="1" cellpadding="15" id="cart-table">

            <tr>

                <th>Plant</th>
                <th>Image</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>

            </tr>

            <tbody id="cart-table-body">

            </tbody>

        </table>

    </section>

    <!-- Order Summary -->

    <section class="summary" id="cart-summary">

        <p>Loading your cart...</p>

    </section>

    <!-- Recommended Products -->

    <section class="recommend">

        <h2>You May Also Like</h2>

        <div class="product-container" id="cart-recommended">

            <p>Loading recommended products...</p>

        </div>

    </section>

    <!-- Footer -->

    <div data-gh-footer-root></div>


<script src="../js/cart.js?v=3"></script>
    <script src="../js/header.js?v=4"></script>
    <script src="../js/premium.js?v=4"></script>
<script src="../js/script.js?v=4"></script>
<script src="../js/products.js?v=3"></script>
<script src="../js/cart-page.js?v=4"></script>
</body>
</html>
