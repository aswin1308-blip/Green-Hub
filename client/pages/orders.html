<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Green Hub | My Orders</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/premium.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div data-gh-header-root></div>

    <!-- Orders -->

    <section class="orders">

        <h1>My Orders</h1>

        <p>Track your purchased plants and orders.</p>

        <div id="orders-gate" style="display:none;">

            <p>Please <a href="login.html">log in</a> to view your orders.</p>

        </div>

        <div id="orders-content">

            <table border="1" cellpadding="15">

                <tr>

                    <th>Order Number</th>

                    <th>Products</th>

                    <th>Quantity</th>

                    <th>Total</th>

                    <th>Status</th>

                    <th>Date</th>

                    <th>Action</th>

                </tr>

                <tbody id="orders-table-body"></tbody>

            </table>

        </div>

    </section>

    <!-- Order Summary -->

    <section class="summary">

        <h2>Purchase Summary</h2>

        <div class="summary-box">

            <p>Total Orders : <strong id="summary-orders-count">0</strong></p>

            <p>Total Amount Spent : <strong id="summary-total-spent">₹0</strong></p>

            <p>Reward Points : <strong>0</strong></p>

        </div>

    </section>

    <!-- Footer -->

    <div data-gh-footer-root></div>


<script src="../js/cart.js?v=3"></script>
    <script src="../js/header.js?v=4"></script>
    <script src="../js/premium.js?v=4"></script>
<script src="../js/script.js?v=5"></script>
</body>

</html>
