<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Hub | My Wishlist</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/premium.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div data-gh-header-root></div>

    <!-- Login Gate -->

    <section class="cart" id="wishlist-gate" style="display:none;">

        <h1>Your Wishlist</h1>

        <p style="text-align:center;">Please log in to view and manage your wishlist.</p>

        <p style="text-align:center; margin-top:20px;">
            <a href="login.html?redirect=wishlist.html" class="btn">Login to Continue</a>
        </p>

    </section>

    <!-- Wishlist Section -->

    <section class="cart" id="wishlist-content" style="display:none;">

        <h1>My Wishlist</h1>

        <table border="1" cellpadding="15" id="wishlist-table">

            <tr>

                <th>Plant</th>
                <th>Image</th>
                <th>Price</th>
                <th>Action</th>

            </tr>

            <tbody id="wishlist-table-body">

            </tbody>

        </table>

        <p style="text-align:center; margin-top:30px;">
            <a href="products.html" class="btn">Continue Shopping</a>
        </p>

    </section>

    <!-- Recommended Products -->

    <section class="recommend">

        <h2>You May Also Like</h2>

        <div class="product-container" id="wishlist-recommended">

            <p>Loading recommended products...</p>

        </div>

    </section>

    <!-- Footer -->

    <div data-gh-footer-root></div>


<script src="../js/cart.js?v=3"></script>
    <script src="../js/header.js?v=4"></script>
    <script src="../js/premium.js?v=5"></script>
<script src="../js/script.js?v=6"></script>
<script src="../js/products.js?v=3"></script>
<script src="../js/wishlist.js?v=2"></script>
</body>

</html>
